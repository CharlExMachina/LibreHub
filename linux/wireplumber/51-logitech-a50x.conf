# Logitech A50 X: split the base station's audio into Game and Voice outputs (WirePlumber 0.5+).
#
# The base station has two playback interfaces, "A50 X Game" and "A50 X Voice", which its
# Game/Voice balance mixes in the headset. PipeWire's default profile only exposes the first one
# (Voice), so all desktop audio lands in the chat channel. This switches the card to its Pro Audio
# profile, names the four devices, makes Game the default output, and sends voice-chat apps to Voice.
#
# Install (the app's Settings page does this for you):
#   mkdir -p ~/.config/wireplumber/wireplumber.conf.d ~/.local/share/wireplumber/scripts
#   cp linux/wireplumber/51-logitech-a50x.conf ~/.config/wireplumber/wireplumber.conf.d/
#   cp linux/wireplumber/logitech-a50x-chat.lua ~/.local/share/wireplumber/scripts/
#   systemctl --user restart wireplumber
#   wpctl set-profile <A50 X device id> <pro-audio index>   # only if a profile was saved earlier

monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.usb-Logitech_A50_X.*" } ]
    actions = { update-props = { device.profile = "pro-audio" } }
  }
  {
    matches = [ { node.name = "~alsa_output.usb-Logitech_A50_X.*\\.pro-output-1$" } ]
    actions = {
      update-props = {
        node.description = "A50 X Game"
        node.nick = "A50 X Game"
        audio.position = [ FL, FR ]
        priority.session = 3000
        priority.driver = 3000
      }
    }
  }
  {
    matches = [ { node.name = "~alsa_output.usb-Logitech_A50_X.*\\.pro-output-0$" } ]
    actions = {
      update-props = {
        node.description = "A50 X Voice"
        node.nick = "A50 X Voice"
        audio.position = [ FL, FR ]
        priority.session = 900
        priority.driver = 900
      }
    }
  }
  {
    matches = [ { node.name = "~alsa_input.usb-Logitech_A50_X.*\\.pro-input-0$" } ]
    actions = {
      update-props = {
        node.description = "A50 X Mic"
        node.nick = "A50 X Mic"
        audio.position = [ MONO ]
        priority.session = 3000
        priority.driver = 3000
      }
    }
  }
  {
    # What the base station sends out of its stream port (the Stream Mix page); handy in OBS.
    matches = [ { node.name = "~alsa_input.usb-Logitech_A50_X.*\\.pro-input-1$" } ]
    actions = {
      update-props = {
        node.description = "A50 X Stream Out"
        node.nick = "A50 X Stream Out"
        audio.position = [ FL, FR ]
        priority.session = 100
        priority.driver = 100
      }
    }
  }
]

# Voice-chat apps play into the Voice channel; everything else follows the default (Game).
# The routing lives in logitech-a50x-chat.lua (install it to ~/.local/share/wireplumber/scripts/).
wireplumber.components = [
  {
    name = logitech-a50x-chat.lua, type = script/lua
    provides = custom.logitech-a50x-chat
  }
]

wireplumber.profiles = {
  main = {
    custom.logitech-a50x-chat = required
  }
}
