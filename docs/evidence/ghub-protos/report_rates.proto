// logi/protocol/report_rates.proto
syntax = "proto3";
package logi.protocol.report_rates;

message ReportRate {
  uint32 value = 1;
  uint32 wireless_rate = 2;  // oneof _wireless_rate
  string device_id = 3;
}
message ReportRates {
  repeated uint32 rates = 1;
  repeated uint32 wireless_rates = 2;
}
message ReportRateAcquire {
  string device_id = 1;
  uint32 value = 2;
  uint32 wireless_value = 3;  // oneof _wireless_value
  uint32 timeout_seconds = 4;
}
message ReportRateLease {
  uint64 token = 1;
}
