// logi/protocol/mouse.proto
syntax = "proto3";
package logi.protocol.mouse;
import "logi/protocol/firmware_lighting.proto";
import "logi/common_protocol/util.proto";
import "logi/protocol/report_rates.proto";

message Dpi {
  enum Direction {
    X = 0;
    Y = 1;
  }
  message State {
    string device_id = 1;
    uint32 dpi = 2;
    uint32 dpi_y = 3;  // oneof _dpi_y
    uint32 dpi_index = 4;
    bool shifted = 5;
    uint32 lod = 6;  // oneof _lod
    bool asymmetric = 7;  // oneof _asymmetric
  }
  message Table {
    repeated uint32 levels = 1;
    uint32 default_dpi = 2;
    uint32 shift_dpi = 3;
    uint32 active_dpi = 4;
  }
  message AdvancedEntry {
    bool disabled = 1;
    bool asymmetric = 2;
    uint32 dpi = 3;
    uint32 dpi_x = 4;  // oneof _dpi_x
    uint32 dpi_y = 5;  // oneof _dpi_y
    uint32 lod = 6;  // oneof _lod
  }
  message AdvancedTable {
    repeated logi.protocol.mouse.Dpi.AdvancedTable.EntriesEntry entries = 1;
    uint32 default_index = 2;
    uint32 shift_index = 3;
    bool advanced_enabled = 4;
  }
  message Shift {
    message State {
      bool enabled = 1;
      uint32 active_dpi = 2;
      uint32 shift_dpi = 3;
      uint32 active_index = 4;
      uint32 shift_index = 5;
    }
    bool on = 1;
    string device_id = 2;
  }
  message Info {
    message Range {
      uint32 min = 1;
      uint32 max = 2;
      uint32 steps = 3;
      uint32 max_levels = 4;
    }
    message Levels {
      repeated uint32 levels = 1;
    }
    message Values {
      repeated uint32 values_x = 1;
      repeated uint32 values_y = 2;
    }
    message Ranges {
      repeated logi.protocol.mouse.Dpi.Info.Ranges.RangesXEntry ranges_x = 1;
      repeated logi.protocol.mouse.Dpi.Info.Ranges.RangesYEntry ranges_y = 2;
    }
    logi.protocol.mouse.Dpi.Info.Range range = 1;  // oneof LegacyIterators
    logi.protocol.mouse.Dpi.Info.Levels levels = 2;  // oneof LegacyIterators
    logi.protocol.mouse.Dpi.Info.Ranges ranges = 3;  // oneof AdvancedIterators
    logi.protocol.mouse.Dpi.Info.Values values = 4;  // oneof AdvancedIterators
    uint32 default_dpi = 5;
    uint32 default_dpi_y = 6;  // oneof _default_dpi_y
    uint32 default_lod = 7;  // oneof _default_lod
    logi.protocol.util.BoolValue supports_asymmetric = 8;
    logi.protocol.util.BoolValue supports_lod = 9;
    logi.protocol.util.BoolValue supports_tuning = 10;
    uint32 effective_dpi_version = 11;  // oneof _effective_dpi_version
  }
  message Indicator {
    message Led {
      logi.protocol.firmware_lighting.Devio.Zone.Type zone_type = 1;
      repeated logi.protocol.mouse.Dpi.Indicator.Led.StepsEntry steps = 2;
    }
  }
  message Tuning {
    enum Type {
      HARDWARE = 0;
      SOFTWARE = 1;
    }
    enum Status {
      INVALID_STATUS = 0;
      SUCCESS = 1;
      CANCEL = 2;
      UNSPECIFIED_FAILURE = -1;
      SENSOR_ERROR = -2;
      TIMEOUT = -3;
      MOUSE_NOT_FOUND = -4;
    }
    message Parameters {
      string device_id = 1;
      logi.protocol.mouse.Dpi.Direction direction = 2;
      int32 samples_to_collect = 3;
      logi.protocol.mouse.Dpi.Tuning.Type type = 4;
      uint32 source_dpi = 5;
    }
    message CalibrationLimits {
      int32 min = 1;
      int32 max = 2;
    }
    int32 dpi_correction = 1;
    logi.protocol.mouse.Dpi.Direction direction = 2;  // oneof _direction
    int32 delta = 3;  // oneof _delta
    logi.protocol.mouse.Dpi.Tuning.Status status = 4;  // oneof _status
  }
  message Correction {
    message Basic {
      int32 correction_x = 1;
      int32 correction_y = 2;  // oneof _correction_y
    }
    string id = 1;
    string name = 2;
    logi.protocol.mouse.Dpi.Tuning tuning = 3;
    logi.protocol.mouse.Dpi.Tuning tuning_y = 4;  // oneof _tuning_y
    uint32 source_dpi = 5;  // oneof _source_dpi
    string source_mouse_name = 6;  // oneof _source_mouse_name
  }
  message Corrections {
    repeated logi.protocol.mouse.Dpi.Corrections.CorrectionsEntry corrections = 1;
  }
  uint32 value = 1;
}
message AngleSnapping {
  bool value = 1;
}
message Info {
  logi.protocol.report_rates.ReportRates report_rates = 1;
  logi.protocol.mouse.Dpi.Info dpi_info = 2;
  logi.protocol.mouse.ModeStatusDevConfig mode_status_config = 4;
  bool is_bunny_hopping_supported = 5;
}
message Settings {
  logi.protocol.report_rates.ReportRate report_rate = 1;
  logi.protocol.mouse.Dpi.Table dpi_table = 2;  // oneof TableType
  logi.protocol.mouse.Dpi.AdvancedTable advanced_dpi_table = 3;  // oneof TableType
  string correction_id = 4;  // oneof Correction
  logi.protocol.mouse.Dpi.Correction.Basic basic_correction = 5;  // oneof Correction
}
message Sensitivity {
  string preset_id = 1;
  int32 active_dpi_index = 2;
}
message ModeStatus {
  enum HybridType {
    LOW_LATENCY = 0;
    POWER_SAVE = 1;
  }
  enum SurfaceModeType {
    AUTOMATIC_DETECTION_MODE = 0;
    LOD_MODE = 1;
    COMPATIBILITY_MODE = 2;
  }
  int32 value = 1;
  logi.protocol.mouse.ModeStatus.HybridType hybrid_mode = 2;
  logi.protocol.mouse.ModeStatus.SurfaceModeType surface_mode = 3;
}
message ModeStatusDevConfig {
  enum SurfaceModeSupport {
    NONE = 0;
    BASIC = 1;
    ADVANCED = 2;
  }
  bool supports_sw_switch = 1;
  bool supports_hybrid_switch = 2;
  logi.protocol.mouse.ModeStatusDevConfig.SurfaceModeSupport surface_mode_support = 3;
}
