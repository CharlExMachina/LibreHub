name: release
# Pushing a tag vX.Y.Z (matching package.json) builds the AppImage and publishes a GitHub
# release. Installed copies of Libre Hub pick it up from there and update themselves.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
      - name: Build the AppImage
        run: npm run dist
      # latest-linux.yml is what the app's updater reads to find the new version.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" \
            release/Libre-Hub-x86_64.AppImage release/latest-linux.yml \
            --title "Libre Hub ${GITHUB_REF_NAME#v}" --notes-file release-notes.md --verify-tag $prerelease
